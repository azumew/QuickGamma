name: Windows ビルドとリリース
on:
  pull_request:
  push:
    branches: [main]
  create:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'create' || (github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v'))
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: テストとリリースビルド
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64 || exit /b 1
          cargo fmt --check || exit /b 1
          cargo test --locked || exit /b 1
          cargo build --release --locked || exit /b 1
      - name: 実行ファイルを保存
        uses: actions/upload-artifact@v4
        with:
          name: QuickGamma-windows-x64
          path: target/release/QuickGamma.exe
          if-no-files-found: error
  release:
    if: github.event_name == 'create' && github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: QuickGamma-windows-x64
      - name: タグに実行ファイルを添付
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.ref }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" QuickGamma.exe --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" QuickGamma.exe --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          fi
