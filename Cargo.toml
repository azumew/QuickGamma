[package]
name = "quickgamma"
version = "0.2.1"
edition = "2021"

[[bin]]
name = "QuickGamma"
path = "src/main.rs"

[dependencies.windows-sys]
version = "0.59"
features = ["Win32_Foundation","Win32_Security","Win32_System_RemoteDesktop","Win32_System_DataExchange","Win32_Graphics_Gdi","Win32_Graphics_Dwm","Win32_System_LibraryLoader","Win32_System_Threading","Win32_UI_WindowsAndMessaging","Win32_UI_Shell","Win32_UI_Controls"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
